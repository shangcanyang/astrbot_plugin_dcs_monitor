<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>位号管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="hero-text">
          <h1>DCS 位号管理</h1>
          <p class="subtitle">
            完整点 ID = <code id="prefix-label">…</code> + 位号，须为 DCS 真实点 ID
          </p>
        </div>
        <span id="monitor-status" class="badge">—</span>
      </header>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-icon">📡</div>
          <div class="stat-body">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">监控点位</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔻</div>
          <div class="stat-body">
            <span class="stat-value" id="stat-low">0</span>
            <span class="stat-label">低阈值告警</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔺</div>
          <div class="stat-body">
            <span class="stat-value" id="stat-high">0</span>
            <span class="stat-label">高阈值告警</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⚙️</div>
          <div class="stat-body">
            <span class="stat-value" id="stat-interval">—</span>
            <span class="stat-label">默认间隔(秒)</span>
          </div>
        </div>
      </section>

      <main class="layout">
        <aside class="panel form-panel">
          <h2 id="form-title">添加点位</h2>
          <form id="point-form" autocomplete="off">
            <label>
              位号（name）<span class="req">*</span>
              <input
                id="f-name"
                type="text"
                required
                placeholder="如 HCY_FICOMP_710B101_PV"
              />
            </label>
            <label>
              描述
              <input id="f-desc" type="text" placeholder="点位说明，缺省同位号" />
            </label>
            <div class="row-2">
              <label>
                低阈值
                <input id="f-low" type="number" step="any" placeholder="低于则预警" />
              </label>
              <label>
                高阈值
                <input id="f-high" type="number" step="any" placeholder="高于则预警" />
              </label>
            </div>
            <label>
              检查间隔（秒，最小 10）
              <input id="f-interval" type="number" min="10" step="1" placeholder="默认 10" />
            </label>
            <div class="actions">
              <button id="btn-submit" type="submit" class="primary">
                <span class="btn-icon">＋</span>添加
              </button>
              <button id="btn-cancel" type="button" class="ghost hidden">取消编辑</button>
            </div>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="panel-head">
            <h2>点位列表</h2>
            <span id="count-label" class="count">共 0 个点位</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>位号</th>
                  <th>描述</th>
                  <th>低阈值</th>
                  <th>高阈值</th>
                  <th>间隔(s)</th>
                  <th>状态</th>
                  <th class="col-ops">操作</th>
                </tr>
              </thead>
              <tbody id="point-tbody">
                <tr>
                  <td colspan="7" class="muted center">加载中…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
